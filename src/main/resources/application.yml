server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orders}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        compression.type: zstd
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
outbox:
  poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:500}
  batch-size: ${OUTBOX_BATCH_SIZE:100}
  lease-seconds: ${OUTBOX_LEASE_SECONDS:120}
